<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte Conceptuelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Literata:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>

/* ============================================================
   1. TES INFOS — modifie les couleurs de base ici si tu veux
   ============================================================ */
:root{
  --bg-deep:#060b09;
  --bg-mid:#0d1a15;
  --surface:#10221c;
  --surface-line: rgba(150,220,190,0.14);
  --accent-bio:#63e6a8;
  --accent-cyan:#4fd8e0;
  --accent-gold:#d9b872;
  --text-primary:#eaf6ef;
  --text-muted:#7fa08f;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Literata', serif;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  height:100%;
  background:
    radial-gradient(ellipse at 50% 30%, var(--bg-mid) 0%, var(--bg-deep) 65%);
  color:var(--text-primary);
  font-family:var(--font-body);
  overflow-x:hidden;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* particules ambiantes discrètes */
.ambient{
  position:fixed; inset:0; pointer-events:none; z-index:0;
}
.ambient span{
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:var(--accent-bio); opacity:0.35; filter:blur(0.5px);
  animation:float 14s ease-in-out infinite;
}
@keyframes float{
  0%,100%{ transform:translateY(0); opacity:0.15;}
  50%{ transform:translateY(-28px); opacity:0.5;}
}

/* ============================================================
   2. EN-TÊTE / BIO
   ============================================================ */
.intro{
  position:relative; z-index:2;
  text-align:center;
  max-width:620px;
  padding:64px 24px 24px;
}
.intro .eyebrow{
  font-family:var(--font-display);
  font-size:13px;
  letter-spacing:0.04em;
  color:var(--accent-cyan);
  margin-bottom:10px;
}
.intro h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(28px, 5vw, 44px);
  color:var(--text-primary);
  margin-bottom:16px;
}
.intro p{
  font-size:16px;
  line-height:1.65;
  color:var(--text-muted);
  font-style:italic;
}

/* ============================================================
   3. LA FLEUR (SVG généré par JS)
   ============================================================ */
.flower-wrap{
  position:relative; z-index:2;
  width:min(90vw, 640px);
  aspect-ratio:1/1;
  margin:12px 0 40px;
}
svg.flower{ width:100%; height:100%; overflow:visible; }

.petal{
  cursor:pointer;
  transform-origin:center;
  transition:filter .35s ease, transform .35s ease;
  opacity:0;
  animation:petalIn .9s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes petalIn{
  from{ opacity:0; transform:scale(0.4); }
  to{ opacity:1; transform:scale(1); }
}
.petal:hover, .petal.active{
  filter:brightness(1.35) drop-shadow(0 0 14px currentColor);
}
.petal:hover .petal-shape, .petal.active .petal-shape{
  transform:scale(1.05);
}
.petal-shape{
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
  transform-origin:center;
}
.petal-label{
  font-family:var(--font-display);
  font-size:13px;
  font-weight:500;
  fill:var(--text-primary);
  pointer-events:none;
  text-anchor:middle;
}

.core-glow{
  animation:pulse 4.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ opacity:0.55; r:78; }
  50%{ opacity:0.85; r:88; }
}
.core-circle{ cursor:default; }
.core-label{
  font-family:var(--font-display);
  font-weight:700;
  font-size:26px;
  fill:var(--bg-deep);
  text-anchor:middle;
  pointer-events:none;
}

/* ============================================================
   4. PANNEAU DE DÉTAIL (s'ouvre au clic sur un pétale)
   ============================================================ */
.panel{
  position:fixed;
  z-index:10;
  right:0; top:0; bottom:0;
  width:min(420px, 100vw);
  background:var(--surface);
  border-left:1px solid var(--surface-line);
  padding:40px 32px;
  transform:translateX(100%);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column;
}
.panel.open{ transform:translateX(0); }
.panel-close{
  align-self:flex-end;
  background:none; border:none;
  color:var(--text-muted);
  font-family:var(--font-display);
  font-size:14px;
  cursor:pointer;
  padding:8px;
  margin-bottom:12px;
}
.panel-close:hover{ color:var(--accent-bio); }
.panel-icon{ font-size:34px; margin-bottom:16px; }
.panel h2{
  font-family:var(--font-display);
  font-size:26px;
  margin-bottom:16px;
}
.panel p{
  font-size:15.5px;
  line-height:1.7;
  color:var(--text-muted);
  margin-bottom:14px;
}
.panel a{
  color:var(--accent-cyan);
  text-decoration:none;
  border-bottom:1px solid currentColor;
  font-size:14px;
}
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.4);
  z-index:9; opacity:0; pointer-events:none; transition:opacity .4s;
}
.overlay.open{ opacity:1; pointer-events:auto; }

footer{
  position:relative; z-index:2;
  font-family:var(--font-display);
  font-size:12px;
  color:var(--text-muted);
  padding-bottom:32px;
  text-align:center;
}

@media (prefers-reduced-motion: reduce){
  .petal, .core-glow, .ambient span{ animation:none !important; opacity:1 !important; }
}

@media (max-width: 560px){
  .panel{ width:100%; }
}
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<div class="intro">
  <div class="eyebrow">CARTE CONCEPTUELLE</div>
  <h1 id="pseudoTitle">TON_PSEUDO</h1>
  <p id="bioText">Ta courte bio arrive ici — deux ou trois phrases qui te présentent.</p>
</div>

<div class="flower-wrap">
  <svg class="flower" id="flowerSvg" viewBox="0 0 800 800"></svg>
</div>

<footer>clique sur un pétale pour en savoir plus</footer>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <button class="panel-close" id="panelClose">FERMER ✕</button>
  <div class="panel-icon" id="panelIcon">🌱</div>
  <h2 id="panelTitle">Discipline</h2>
  <p id="panelDesc">Description.</p>
  <a id="panelLink" href="#" target="_blank" style="display:none;">En savoir plus →</a>
</aside>

<script>
/* ============================================================
   5. CONFIGURATION — C'EST ICI QUE TU REMPLIS TOUT
   ============================================================
   1) Change PSEUDO et BIO
   2) Ajoute / retire / modifie des objets dans DISCIPLINES
      (autant de pétales que d'objets dans la liste)
   ============================================================ */

const CONFIG = {
  pseudo: "TON_PSEUDO",
  bio: "Ta courte bio arrive ici — deux ou trois phrases qui te présentent.",

  disciplines: [
    {
      nom: "Permaculture",
      icone: "🌿",
      couleur: "#63e6a8",
      description: "Décris ici ta pratique ou ton lien avec cette discipline.",
      lien: "" // optionnel, laisse vide "" si pas de lien
    },
    {
      nom: "Code",
      icone: "💻",
      couleur: "#4fd8e0",
      description: "Décris ici ta pratique ou ton lien avec cette discipline.",
      lien: ""
    },
    {
      nom: "Musique",
      icone: "🎵",
      couleur: "#d9b872",
      description: "Décris ici ta pratique ou ton lien avec cette discipline.",
      lien: ""
    },
    {
      nom: "Design",
      icone: "✏️",
      couleur: "#7ea8ff",
      description: "Décris ici ta pratique ou ton lien avec cette discipline.",
      lien: ""
    },
    {
      nom: "Écriture",
      icone: "📖",
      couleur: "#e08fd0",
      description: "Décris ici ta pratique ou ton lien avec cette discipline.",
      lien: ""
    }
  ]
};

/* ============================================================
   6. MOTEUR — tu n'as normalement pas besoin de toucher en dessous
   ============================================================ */

document.getElementById('pseudoTitle').textContent = CONFIG.pseudo;
document.getElementById('bioText').textContent = CONFIG.bio;
document.title = CONFIG.pseudo + " — Carte Conceptuelle";

// particules ambiantes
const ambient = document.getElementById('ambient');
for(let i=0;i<22;i++){
  const s = document.createElement('span');
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*100+'%';
  s.style.animationDelay = (Math.random()*10)+'s';
  s.style.animationDuration = (10+Math.random()*10)+'s';
  ambient.appendChild(s);
}

// construction de la fleur
const svg = document.getElementById('flowerSvg');
const cx = 400, cy = 400;
const n = CONFIG.disciplines.length;
const petalLength = Math.min(220, 130 + (7-n)*8);
const petalWidth = Math.max(60, 150 - n*8);
const coreRadius = 78;

const ns = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(ns, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// glow défini une fois
const defs = el('defs', {});
defs.innerHTML = `
  <radialGradient id="coreGrad" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="${'#eaffef'}"/>
    <stop offset="100%" stop-color="${'#63e6a8'}"/>
  </radialGradient>
`;
svg.appendChild(defs);

// halo derrière le centre
svg.appendChild(el('circle', {
  class:'core-glow', cx, cy, r:78, fill:'var(--accent-bio)', 'fill-opacity':'0.18'
}));

CONFIG.disciplines.forEach((d, i) => {
  const angle = -90 + i * (360 / n);
  const g = el('g', {
    class:'petal',
    style:`animation-delay:${0.15 + i*0.12}s; color:${d.couleur}`,
    'data-index': i
  });
  const inner = el('g', {
    transform:`translate(${cx},${cy}) rotate(${angle})`
  });

  const tipY = -(coreRadius*0.4 + petalLength);
  const path = `M0,${-coreRadius*0.4}
    C ${-petalWidth/2},${-coreRadius*0.4 - petalLength*0.35}
      ${-petalWidth/2},${-coreRadius*0.4 - petalLength*0.75}
      0,${tipY}
    C ${petalWidth/2},${-coreRadius*0.4 - petalLength*0.75}
      ${petalWidth/2},${-coreRadius*0.4 - petalLength*0.35}
      0,${-coreRadius*0.4} Z`;

  const shape = el('path', {
    class:'petal-shape', d:path, fill:d.couleur, 'fill-opacity':'0.85'
  });
  inner.appendChild(shape);

  const label = el('text', {
    class:'petal-label',
    x:0, y:tipY - 14
  });
  label.textContent = (d.icone ? d.icone+' ' : '') + d.nom;
  inner.appendChild(label);

  g.appendChild(inner);
  g.addEventListener('click', () => openPanel(i));
  svg.appendChild(g);
});

// centre
svg.appendChild(el('circle', {
  class:'core-circle', cx, cy, r:coreRadius, fill:'url(#coreGrad)'
}));
const coreText = el('text', { class:'core-label', x:cx, y:cy+9 });
coreText.textContent = CONFIG.pseudo;
svg.appendChild(coreText);

// panneau de détail
const panel = document.getElementById('panel');
const overlay = document.getElementById('overlay');
function openPanel(i){
  const d = CONFIG.disciplines[i];
  document.getElementById('panelIcon').textContent = d.icone || '🌱';
  document.getElementById('panelTitle').textContent = d.nom;
  document.getElementById('panelDesc').textContent = d.description;
  const link = document.getElementById('panelLink');
  if(d.lien){ link.href = d.lien; link.style.display = 'inline-block'; }
  else{ link.style.display = 'none'; }

  document.querySelectorAll('.petal').forEach(p => p.classList.remove('active'));
  document.querySelector(`.petal[data-index="${i}"]`).classList.add('active');

  panel.classList.add('open');
  overlay.classList.add('open');
}
function closePanel(){
  panel.classList.remove('open');
  overlay.classList.remove('open');
  document.querySelectorAll('.petal').forEach(p => p.classList.remove('active'));
}
document.getElementById('panelClose').addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });
</script>
</body>
</html>
